<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JJK: Cursed Technique</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
        }

        #ui {
            position: absolute;
            top: 16%;
            width: 100%;
            text-align: center;
            color: #fff;
            pointer-events: none;
            z-index: 10;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            letter-spacing: 10px;
            font-weight: 900;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #technique-name {
            font-size: 1.2rem;
            color: #00ffff;
            margin-top: 15px;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }

        #energy-row {
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #energy-label {
            font-size: 0.55rem;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.25);
        }

        #energy-track {
            width: 120px;
            height: 1px;
            background: rgba(255,255,255,0.08);
            position: relative;
        }

        #energy-fill {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            width: 0%;
            background: #00ffff;
            transition: width 0.7s cubic-bezier(0.4,0,0.2,1), background 0.4s ease;
        }

        #credit-line {
            margin-top: 14px;
            font-size: 0.5rem;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.08);
        }

        #video-container {
            position: absolute;
            bottom: 2%;
            left: 2%;
            width: 42vw;
            max-width: 220px;
            height: 26vh;
            border: 2px solid rgba(255,255,255,0.2);
            z-index: 20;
            background-color: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transform: scaleX(-1);
        }

        #output_canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform: scaleX(-1);
        }

        #grain {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
        }

        /* Gesture Guide */
        #gesture-guide {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            z-index: 15;
            pointer-events: none;
            padding: 6px 0 4px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85) 80%, transparent);
        }

        #gesture-scroll {
            display: flex;
            flex-direction: row;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 12px 6px;
            pointer-events: all;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        #gesture-scroll::-webkit-scrollbar { display: none; }

        .gcard {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 5px 7px 4px;
            min-width: 56px;
            transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
        }

        .gcard.active {
            border-color: var(--gc);
            background: rgba(255,255,255,0.10);
            box-shadow: 0 0 10px var(--gc);
        }

        .gcard svg { width: 36px; height: 36px; }

        .gcard-name {
            font-size: 0.34rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.55);
            text-align: center;
            line-height: 1.3;
            max-width: 58px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .gcard.active .gcard-name { color: var(--gc); }

        .gcard-hint {
            font-size: 0.28rem;
            color: rgba(255,255,255,0.3);
            letter-spacing: 1px;
        }

        #flash {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 4;
            opacity: 0;
            transition: opacity 0.06s;
        }

        #perf {
            position: absolute; top: 12px; left: 14px;
            font-size: 0.45rem;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.12);
            z-index: 30;
            pointer-events: none;
        }

        #cam-status {
            position: absolute;
            bottom: 3%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.38rem;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.18);
            z-index: 30;
            pointer-events: none;
        }

        #loading {
            position: fixed; inset: 0;
            background: #000;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            transition: opacity 1s ease;
        }

        #loading .load-kanji {
            font-size: 4rem;
            color: rgba(255,255,255,0.7);
            letter-spacing: 8px;
        }

        #loading .load-bar {
            width: 180px; height: 1px;
            background: rgba(255,255,255,0.07);
        }

        #loading .load-fill {
            height: 100%;
            background: #00ffff;
            width: 0%;
            transition: width 0.2s ease;
        }

        #loading .load-sub {
            font-size: 0.5rem;
            letter-spacing: 4px;
            color: rgba(255,255,255,0.2);
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="gesture-guide">
    <div id="gesture-scroll"><!-- cards injected by JS --></div>
</div>

<div id="loading">
    <div class="load-kanji">呪術廻戦</div>
    <div class="load-bar"><div class="load-fill" id="load-fill"></div></div>
    <div class="load-sub">INITIALIZING CURSED ENERGY</div>
</div>

<div id="grain"></div>
<div id="flash"></div>
<div id="perf">—</div>
<div id="cam-status">DETECTING</div>

<div id="ui">
    <h1>呪術廻戦</h1>
    <div id="technique-name">CURSED ENERGY</div>
    <div id="energy-row">
        <span id="energy-label">CURSED OUTPUT</span>
        <div id="energy-track"><div id="energy-fill"></div></div>
    </div>
    <div id="credit-line">ORIGINAL: REINESANA &nbsp;·&nbsp; ENHANCED: SHIZUADEV</div>
</div>

<div id="video-container">
    <video class="input_video" playsinline muted></video>
    <canvas id="output_canvas"></canvas>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ─── Performance Tier ─────────────────────────────────────────────────────────
const isMob = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
const cores = navigator.hardwareConcurrency || 2;
const tier  = isMob ? 0 : (cores <= 2 ? 0 : cores <= 4 ? 1 : 2);
const COUNT = [5000, 11000, 20000][tier];
const PR    = [1, 1.25, Math.min(window.devicePixelRatio, 2)][tier];
const LERP  = [0.12, 0.09, 0.07][tier];
const MCX   = [0, 0, 1][tier];
const CAM_W = [320, 480, 640][tier];
const CAM_H = [240, 360, 480][tier];
document.getElementById('perf').textContent = ['LOW','MID','HIGH'][tier];

// ─── Loading ──────────────────────────────────────────────────────────────────
const lf = document.getElementById('load-fill');
let lp = 0;
const li = setInterval(() => { lp = Math.min(lp + Math.random()*14, 90); lf.style.width = lp+'%'; }, 150);
function dismissLoad() {
    clearInterval(li); lf.style.width = '100%';
    setTimeout(() => {
        const el = document.getElementById('loading');
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 1000);
    }, 350);
}
setTimeout(dismissLoad, 1800);

// ─── Three.js Scene ───────────────────────────────────────────────────────────
const scene  = new THREE.Scene();
const cam3   = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
cam3.position.z = 55;

const renderer = new THREE.WebGLRenderer({
    antialias: tier >= 2, alpha: true,
    powerPreference: tier === 0 ? 'low-power' : 'high-performance'
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(PR);
document.body.appendChild(renderer.domElement);

const composer  = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam3));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
composer.addPass(bloomPass);

// ─── Particle Buffers ─────────────────────────────────────────────────────────
const geometry  = new THREE.BufferGeometry();
const positions = new Float32Array(COUNT * 3);
const colors    = new Float32Array(COUNT * 3);
const sizes     = new Float32Array(COUNT);
const tPos      = new Float32Array(COUNT * 3);
const tCol      = new Float32Array(COUNT * 3);
const tSiz      = new Float32Array(COUNT);
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color',    new THREE.BufferAttribute(colors,    3));
geometry.setAttribute('size',     new THREE.BufferAttribute(sizes,     1));
const particles = new THREE.Points(geometry, new THREE.PointsMaterial({
    size: 0.3, vertexColors: true,
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, sizeAttenuation: true
}));
scene.add(particles);

// ─── Helpers ──────────────────────────────────────────────────────────────────
const TAU = Math.PI * 2;
const R   = Math.random;
function st(i, x, y, z, r, g, b, s) { tPos[i*3]=x;tPos[i*3+1]=y;tPos[i*3+2]=z;tCol[i*3]=r;tCol[i*3+1]=g;tCol[i*3+2]=b;tSiz[i]=s; }
function sph(rad) { const t=R()*TAU,p=Math.acos(2*R()-1); return [rad*Math.sin(p)*Math.cos(t),rad*Math.sin(p)*Math.sin(t),rad*Math.cos(p)]; }

// ─── Technique Generators ─────────────────────────────────────────────────────
function genNeutral(i)     { if(i<COUNT*0.05){const[x,y,z]=sph(15+R()*20);st(i,x,y,z,.05,.08,.2,.4);}else st(i,0,0,0,0,0,0,0); }
function genRed(i)         { if(i<COUNT*.1){const[x,y,z]=sph(R()*9);st(i,x,y,z,3,.1,.1,2.5);}else{const t=i/COUNT,a=t*15+(i%3)*(TAU/3),r=2+t*40;st(i,r*Math.cos(a),r*Math.sin(a),(R()-.5)*(10*t),.8,0,0,1);} }
function genBlue(i)        { if(i<COUNT*.1){const[x,y,z]=sph(R()*8);st(i,x,y,z,.05,.3,3,2.5);}else{const t=i/COUNT,a=-t*15+(i%3)*(TAU/3),r=2+t*40;st(i,r*Math.cos(a),r*Math.sin(a),(R()-.5)*(10*t),0,.15,1,1);} }
function genPurple(i)      { if(R()>.8){st(i,(R()-.5)*100,(R()-.5)*100,(R()-.5)*100,.5,.1,.7,.8);return;}const[x,y,z]=sph(20);st(i,x,y,z,.6,.05,1,2.5); }
function genVoid(i)        { if(i<COUNT*.15){const a=R()*TAU;st(i,26*Math.cos(a),26*Math.sin(a),(R()-.5),1,1,1,2.5);}else{const[x,y,z]=sph(30+R()*90);st(i,x,y,z,.1,.6,1,.7);} }
function genLimitless(i)   { const rg=i%7,a=(i/COUNT)*TAU*3+rg*(TAU/7),r=6+rg*7,sp=(R()-.5)*2;st(i,r*Math.cos(a)+sp,r*Math.sin(a)*.35+sp*.4,sp*5,.85,.92,1,rg===0?3:.85); }
function genStarRage(i)    { const[x,y,z]=sph(3+R()*80),d=Math.sqrt(x*x+y*y+z*z),b=d<10?3.5:d<28?1.8:.6;st(i,x,y,z,b,b,b,b>2?3:.85); }
function genMalevolent(i)  { st(i,(R()-.5)*12,(R()-.5)*12,(R()-.5)*12,.8,0,0,i<COUNT*.1?3:.5); }
function genShrine(i)      { if(i<COUNT*.3){st(i,(R()-.5)*80,-15,(R()-.5)*80,.4,0,0,.8);}else if(i<COUNT*.4){const px=((i%4)<2?1:-1)*12,pz=((i%4)%2===0?1:-1)*8;st(i,px+(R()-.5)*2,-15+R()*30,pz+(R()-.5)*2,.2,.02,.02,.6);}else if(i<COUNT*.6){const t=R()*TAU,rd=R()*30,cv=Math.pow(rd/30,2)*10;st(i,rd*Math.cos(t),15-cv+R()*2,rd*Math.sin(t)*.6,.6,0,0,.6);}else st(i,0,0,0,0,0,0,0); }
function genDismantle(i)   { const bl=i%8,f=i/COUNT,a=bl*(TAU/8),r=1+f*50,th=Math.sin(f*Math.PI)*2.5;st(i,r*Math.cos(a)+th*Math.cos(a+Math.PI/2),r*Math.sin(a)+th*Math.sin(a+Math.PI/2),(R()-.5)*3,1.2,.08,0,i<COUNT*.05?3.5:1); }
function genCleave(i)      { const f=i/COUNT,bl=(i%4)-1.5,sw=f*60-30,th=Math.sin(f*Math.PI)*4;st(i,sw+th*bl*.3,sw*.4+th,(R()-.5)*5,1.3,.15,0,i<COUNT*.06?3:.9); }
function genProjection(i)  { const gs=Math.ceil(Math.sqrt(COUNT))*.55,gx=(i%gs)-gs/2,gy=Math.floor(i/gs)-gs/2,w=Math.sin(gx*.45)*Math.cos(gy*.45)*3.5,on=Math.abs(gx%5)<.7||Math.abs(gy%5)<.7;if(on)st(i,gx*1.7,gy*.45,w,.2,.9,.75,1.3);else st(i,gx*1.7,gy*.45,w,.02,.1,.08,.15); }
function genStrawDoll(i)   { const nl=i%12,f=i/COUNT,a=nl*(TAU/12),r=f*45,p=Math.sin(f*15)>0?1:.12;st(i,r*Math.cos(a),r*Math.sin(a)*.6,(R()-.5)*4,1,.7,0,p*(i<COUNT*.06?3:.9)); }
function genBloodPond(i)   { if(i<COUNT*.4){const a=R()*TAU,r=R()*40;st(i,r*Math.cos(a),-15+(Math.sin(r*.5)*1.5)+(R()*.4),r*Math.sin(a)*.3,1.2,0,.04,.8);}else{const f=(i/COUNT)*TAU*5;st(i,(2+f*.8)*Math.cos(f),(R()-.5)*35,(2+f*.8)*Math.sin(f),1.1,.02,.02,.6);} }
function genPiercing(i)    { const bm=i%16,f=R(),a=bm*(TAU/16),r=5+f*55;st(i,r*Math.cos(a),r*Math.sin(a)*.5,(R()-.5)*5,1.3,0,0,(1-f)*2.5); }
function genCursedSpeech(i){ const rg=i%9,f=i/COUNT,a=f*TAU*2,r=4+rg*5,p=Math.sin(rg-f*30)*.5+.5;st(i,r*Math.cos(a),r*Math.sin(a)*.25+(R()-.5)*.5,(R()-.5)*1.5,.9,.9,.2,p*1.8); }
function genRika(i)        { const f=i/COUNT,[x,y,z]=sph(8+f*50),d=Math.sqrt(x*x+y*y+z*z),b=d<20?2.5:.7;st(i,x+(R()-.5)*3,y+(R()-.5)*3,z+(R()-.5)*3,b,.05*b,.8*b,b>1?2.2:.8); }
function genFurnace(i)     { const rise=R()*55-5,fl=Math.max(0,(28-rise)*.85),j=(R()-.5)*fl,r=fl*.4+Math.abs(j)*.3,a=R()*TAU,hot=rise<8?3:rise<22?1.6:.6;st(i,r*Math.cos(a)+j*.3,rise,r*Math.sin(a)+j*.2,1.3*hot,.3*hot,0,hot>2?2.8:.85); }
function genTenShadows(i)  { const arm=i%10,f=i/COUNT,a=(arm/10)*TAU,r=4+f*42,w=Math.sin(f*12+arm*.8)*3;st(i,r*Math.cos(a)+w,r*Math.sin(a)*.5+w*.3,(R()-.5)*r*.4,.9,.5,0,i<COUNT*.1?2:.7); }
function genDragon(i)      { const f=(i/COUNT)*TAU*7,layer=i%3,sR=(8+layer*7)+f*.6,w=Math.sin(f*5)*2.5;st(i,sR*Math.cos(f)+w,f*2.8-22,sR*Math.sin(f),.1,1.1,.35,i<COUNT*.04?3:.9); }
function genReversal(i)    { const f=(i/COUNT)*TAU,p=i%5,pa=f+p*(TAU/5),r=Math.abs(Math.sin(f*5))*24+R()*4,gw=i<COUNT*.06?3:.85;st(i,r*Math.cos(pa),r*Math.sin(pa)*.65,(R()-.5)*r*.45,1.1*gw,.2*gw,.55*gw,1); }

// ─── Technique Config ─────────────────────────────────────────────────────────
const ENERGY = {
    neutral:0,red:55,blue:55,purple:95,void:80,limitless:75,starRage:100,
    malevolent:60,shrine:90,dismantle:70,cleave:75,projection:45,strawDoll:65,
    bloodPond:72,piercing:78,cursedSpeech:68,rika:92,furnace:85,tenShadows:65,dragon:50,reversal:60
};
const TECH = {
    neutral:     {name:'CURSED ENERGY',                       color:'#00ffff',bloom:1.0, fn:genNeutral     },
    red:         {name:'Reverse Cursed Technique: Red',       color:'#ff3333',bloom:2.5, fn:genRed         },
    blue:        {name:'Cursed Technique: Blue',              color:'#3399ff',bloom:2.5, fn:genBlue        },
    purple:      {name:'Secret Technique: Hollow Purple',     color:'#bb00ff',bloom:4.0, fn:genPurple      },
    void:        {name:'Domain Expansion: Infinite Void',     color:'#00ffff',bloom:2.0, fn:genVoid        },
    limitless:   {name:'Infinity: Limitless',                 color:'#cceeff',bloom:2.0, fn:genLimitless   },
    starRage:    {name:'Unlimited: Star Rage',                color:'#ffffff',bloom:5.5, fn:genStarRage    },
    malevolent:  {name:'Malevolent Fist',                     color:'#cc0000',bloom:3.0, fn:genMalevolent  },
    shrine:      {name:'Domain Expansion: Malevolent Shrine', color:'#ff0000',bloom:2.5, fn:genShrine      },
    dismantle:   {name:'Sukuna CT: Dismantle',                color:'#ff5500',bloom:2.8, fn:genDismantle   },
    cleave:      {name:'Sukuna CT: Cleave',                   color:'#ff6622',bloom:2.8, fn:genCleave      },
    projection:  {name:'Projection Sorcery: Ratio Technique', color:'#00ffcc',bloom:1.8, fn:genProjection  },
    strawDoll:   {name:'Straw Doll Technique: Hairpin',       color:'#ffcc00',bloom:2.2, fn:genStrawDoll   },
    bloodPond:   {name:'Blood Pond: Supernova Convergence',   color:'#ff4422',bloom:2.8, fn:genBloodPond   },
    piercing:    {name:'Piercing Blood',                      color:'#ff1111',bloom:3.2, fn:genPiercing    },
    cursedSpeech:{name:'Cursed Speech: Fallen, Burst',        color:'#ffff88',bloom:2.2, fn:genCursedSpeech},
    rika:        {name:'Rika: Cursed Spirit Manifestation',   color:'#ff44cc',bloom:3.8, fn:genRika        },
    furnace:     {name:'Maximum CT: Meteor Furnace',          color:'#ff6600',bloom:3.5, fn:genFurnace     },
    tenShadows:  {name:'Ten Shadows Technique: Divergence',   color:'#ffaa00',bloom:2.5, fn:genTenShadows  },
    dragon:      {name:'Cursed Tool: Dragon Bone',            color:'#00ff88',bloom:2.0, fn:genDragon      },
    reversal:    {name:'Reverse CT: Cursed Flower',           color:'#ff69b4',bloom:2.5, fn:genReversal    },
};
const ROT_SPEED = {
    neutral:{y:.004,x:.001,z:0},    red:{y:0,x:0,z:-.1},         blue:{y:0,x:0,z:.08},
    purple:{y:.05,x:0,z:.2},        void:{y:.006,x:.002,z:0},     limitless:{y:.008,x:.003,z:.004},
    starRage:{y:.018,x:.009,z:.012},malevolent:{y:.02,x:.01,z:.01},shrine:{y:0,x:0,z:0},
    dismantle:{y:0,x:0,z:.07},      cleave:{y:.1,x:0,z:.04},      projection:{y:.012,x:0,z:0},
    strawDoll:{y:.08,x:0,z:-.05},   bloodPond:{y:.04,x:0,z:0},    piercing:{y:0,x:0,z:-.1},
    cursedSpeech:{y:.015,x:.01,z:0},rika:{y:.06,x:.02,z:.03},     furnace:{y:0,x:-.018,z:.06},
    tenShadows:{y:.07,x:0,z:0},     dragon:{y:.03,x:.012,z:0},    reversal:{y:0,x:.02,z:-.05},
};

// ─── UI State ─────────────────────────────────────────────────────────────────
let currentTech    = 'neutral';
let shakeIntensity = 0;
let glowColor      = '#00ffff';
const techNameEl   = document.getElementById('technique-name');
const energyFill   = document.getElementById('energy-fill');
const flashEl      = document.getElementById('flash');
const camStatusEl  = document.getElementById('cam-status');

function activateTech(key) {
    if (!TECH[key]) key = 'neutral';   // FIX: guard unknown keys
    if (currentTech === key) return;
    currentTech = key;
    const t = TECH[key];
    glowColor = t.color;
    bloomPass.strength = t.bloom;
    techNameEl.innerText = t.name;
    techNameEl.style.color = t.color;
    techNameEl.style.textShadow = `0 0 10px ${t.color}88`;
    energyFill.style.width      = ENERGY[key] + '%';
    energyFill.style.background = t.color;
    shakeIntensity = key !== 'neutral' ? t.bloom * 0.08 : 0;
    flashEl.style.background = t.color + '14';
    flashEl.style.opacity = '1';
    setTimeout(() => { flashEl.style.opacity = '0'; }, 80);
    particles.rotation.set(0, 0, 0);
    for (let i = 0; i < COUNT; i++) t.fn(i);
}

// ─── Gesture Guide Panel ──────────────────────────────────────────────────────
const GUIDE_DATA = [
    {key:'purple',      label:'Hollow Purple', color:'#bb00ff',T:0,  I:'p',M:0,  R:0, P:0,  hint:'Pinch'      },
    {key:'starRage',    label:'Star Rage',      color:'#ffffff',T:1,  I:1,  M:1,  R:1, P:'s',hint:'Spread wide'},
    {key:'shrine',      label:'Mal. Shrine',    color:'#ff0000',T:1,  I:1,  M:1,  R:1, P:1,  hint:'All fingers'},
    {key:'reversal',    label:'Reverse CT',     color:'#ff69b4',T:0,  I:1,  M:1,  R:1, P:0,  hint:''           },
    {key:'dismantle',   label:'Dismantle',      color:'#ff5500',T:0,  I:1,  M:1,  R:0, P:1,  hint:''           },
    {key:'blue',        label:'CT: Blue',       color:'#3399ff',T:0,  I:1,  M:1,  R:0, P:0,  hint:''           },
    {key:'projection',  label:'Projection',     color:'#00ffcc',T:0,  I:1,  M:0,  R:1, P:0,  hint:''           },
    {key:'bloodPond',   label:'Blood Pond',     color:'#ff4422',T:0,  I:0,  M:1,  R:1, P:0,  hint:''           },
    {key:'dragon',      label:'Dragon Bone',    color:'#00ff88',T:0,  I:1,  M:0,  R:0, P:1,  hint:''           },
    {key:'cursedSpeech',label:'Cursed Speech',  color:'#ffff88',T:0,  I:0,  M:1,  R:0, P:0,  hint:''           },
    {key:'strawDoll',   label:'Straw Doll',     color:'#ffcc00',T:0,  I:0,  M:0,  R:1, P:0,  hint:''           },
    {key:'rika',        label:'Rika',           color:'#ff44cc',T:1,  I:1,  M:1,  R:0, P:1,  hint:''           },
    {key:'void',        label:'Infinite Void',  color:'#00ffff',T:1,  I:0,  M:0,  R:0, P:0,  hint:'Fist+thumb' },
    {key:'malevolent',  label:'Malevolent',     color:'#cc0000',T:0,  I:0,  M:0,  R:0, P:0,  hint:'Tight fist' },
    {key:'red',         label:'CT: Red',        color:'#ff3333',T:0,  I:1,  M:0,  R:0, P:0,  hint:''           },
    {key:'limitless',   label:'Limitless',      color:'#cceeff',T:1,  I:0,  M:0,  R:0, P:0,  hint:'Thumb only' },
    {key:'piercing',    label:'Piercing Blood', color:'#ff1111',T:1,  I:1,  M:1,  R:1, P:0,  hint:''           },
    {key:'tenShadows',  label:'Ten Shadows',    color:'#ffaa00',T:'h',I:0,  M:0,  R:0, P:0,  hint:'Half thumb' },
    {key:'furnace',     label:'Furnace',        color:'#ff6600',T:1,  I:1,  M:0,  R:0, P:0,  hint:'+thumb out' },
    {key:'cleave',      label:'Cleave',         color:'#ff6622',T:0,  I:1,  M:0,  R:0, P:0,  hint:''           },
];

function makeHandSVG(d, color) {
    const cols=[8,17,23,29,35], bases=[28,30,30,30,30], maxH=[14,20,22,20,17], flags=[d.T,d.I,d.M,d.R,d.P];
    let rects='';
    for(let f=0;f<5;f++){
        const fl=flags[f],x=cols[f],bY=bases[f];
        let h,op,sp='';
        if(fl===1){h=maxH[f];op=1;}else if(fl===0){h=maxH[f]*.38;op=.25;}
        else if(fl==='p'){h=maxH[f]*.5;op=.5;sp=`<circle cx="12.5" cy="18" r="5" fill="none" stroke="${color}" stroke-width="1.5" opacity="0.9"/>`;}
        else if(fl==='s'){h=maxH[f];op=1;}else if(fl==='h'){h=maxH[f]*.6;op=.6;}else{h=maxH[f]*.38;op=.25;}
        rects+=`<rect x="${x-2.5}" y="${bY-h}" width="5" height="${h}" rx="2.5" fill="${color}" opacity="${op}"/>${sp}`;
    }
    const palm=`<rect x="5.5" y="28" width="33" height="9" rx="4" fill="${color}" opacity="0.55"/>`;
    const arc=flags[4]==='s'?`<path d="M8,26 Q22,10 36,26" fill="none" stroke="${color}" stroke-width="1" opacity="0.35" stroke-dasharray="2,2"/>` :'';
    return `<svg viewBox="0 0 44 40" xmlns="http://www.w3.org/2000/svg">${palm}${rects}${arc}</svg>`;
}

const scrollEl = document.getElementById('gesture-scroll');
const cardMap  = {};
for(const d of GUIDE_DATA){
    const card=document.createElement('div');
    card.className='gcard';
    card.style.setProperty('--gc',d.color);
    card.dataset.key=d.key;
    card.innerHTML=makeHandSVG(d,d.color)
        +`<div class="gcard-name">${d.label}</div>`
        +(d.hint?`<div class="gcard-hint">${d.hint}</div>`:'');
    scrollEl.appendChild(card);
    cardMap[d.key]=card;
}

function activateTechWithGuide(key) {
    if (!TECH[key]) key = 'neutral';
    activateTech(key);
    for(const[k,el] of Object.entries(cardMap)) el.classList.toggle('active', k===key);
    if(cardMap[key]) cardMap[key].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}

// ─── Gesture Detection ────────────────────────────────────────────────────────
const videoElement  = document.querySelector('.input_video');
const canvasElement = document.getElementById('output_canvas');
const canvasCtx     = canvasElement.getContext('2d');

let smoothedLM = null;
const SMOOTH_ALPHA = 0.55;
function lerpLM(prev,next,a){ return prev.map((p,i)=>({x:p.x+(next[i].x-p.x)*a,y:p.y+(next[i].y-p.y)*a,z:p.z+(next[i].z-p.z)*a})); }
function fingerExt(lm,tip,pip){ return Math.max(0,Math.min(1,(lm[pip].y-lm[tip].y)*10)); }
function thumbExt(lm){ const dx=Math.abs(lm[4].x-lm[2].x),dy=Math.abs(lm[4].y-lm[2].y);return Math.max(0,Math.min(1,(dx-dy)*7)); }
function pinchConf(lm){ const d=Math.hypot(lm[8].x-lm[4].x,lm[8].y-lm[4].y);return Math.max(0,1-d/.065); }

function classifyHand(lm) {
    const idx=fingerExt(lm,8,6),mid=fingerExt(lm,12,10),rng=fingerExt(lm,16,14),pnk=fingerExt(lm,20,18);
    const thb=thumbExt(lm),pin=pinchConf(lm),spread=Math.hypot(lm[4].x-lm[20].x,lm[4].y-lm[20].y);
    const UP=.65,DOWN=.28;
    const iU=idx>UP,iD=idx<DOWN,mU=mid>UP,mD=mid<DOWN,rU=rng>UP,rD=rng<DOWN,pU=pnk>UP,pD=pnk<DOWN,tU=thb>.6,tD=thb<.25;
    if(pin>.80)                           return ['purple',      pin];
    if(spread>.44&&iU&&mU&&rU&&pU)        return ['starRage',    .9];
    if(iU&&mU&&rU&&pU&&tU)               return ['shrine',      (idx+mid+rng+pnk+thb)/5];
    if(iU&&mU&&rU&&pU)                   return ['shrine',      (idx+mid+rng+pnk)/4];
    if(iU&&mU&&rU&&pD&&tU)               return ['piercing',    (idx+mid+rng)/3];
    if(iU&&mU&&rU&&pD)                   return ['reversal',    (idx+mid+rng)/3];
    if(iU&&mU&&rD&&pU&&tU)               return ['rika',        .8];
    if(iU&&mU&&rD&&pU)                   return ['dismantle',   (idx+mid+pnk)/3];
    if(iU&&mU&&rD&&pD)                   return ['blue',        (idx+mid)/2];
    if(iU&&mD&&rU&&pD)                   return ['projection',  (idx+rng)/2];
    if(iD&&mU&&rU&&pD)                   return ['bloodPond',   (mid+rng)/2];
    if(iU&&mD&&rD&&pU)                   return ['dragon',      (idx+pnk)/2];
    if(iD&&mU&&rD&&pD)                   return ['cursedSpeech', mid];
    if(iD&&mD&&rU&&pD)                   return ['strawDoll',   rng];
    if(iD&&mD&&rD&&pD&&tU)               return ['void',        thb];
    if(iD&&mD&&rD&&pD&&thb>.3&&thb<.65) return ['tenShadows',  thb];
    if(iD&&mD&&rD&&pD&&tD)               return ['malevolent',  .7];
    if(iU&&mD&&rD&&pD&&thb>.4)           return ['furnace',     idx*.8];
    if(iU&&mD&&rD&&pD)                   return ['red',         idx];
    if(tU&&iD&&mD&&rD&&pD)               return ['limitless',   thb];
    return ['neutral', .5];
}

// ─── Voting / Hysteresis ──────────────────────────────────────────────────────
const HIST_SIZE=8, HOLD_CONFIRM=5, HOLD_RELEASE=10;
const gestureHistory=[];
let lockedGesture='neutral', lockCounter=0, lastChallengerKey='neutral';

// ─── FIX: All pipeline vars declared at top level before any use ──────────────
let isProcessing = false;
let lastResultTs = Date.now();
let pipelineDead = false;
let handsInst    = null;
let camInst      = null;

function resetPipelineState() {
    smoothedLM=null; gestureHistory.length=0;
    lockedGesture='neutral'; lockCounter=0; lastChallengerKey='neutral';
    isProcessing=false;
}

function onHandResults(results) {
    // FIX: release in-flight guard immediately — before any early return
    isProcessing = false;
    lastResultTs = Date.now();
    camStatusEl.textContent = 'DETECTING';

    // FIX: skip frame if video not ready (avoids 0×0 canvas GPU deadlock)
    const vw=videoElement.videoWidth, vh=videoElement.videoHeight;
    if(!vw||!vh) return;

    // FIX: only resize canvas when dimensions actually changed (avoids GPU churn every frame)
    if(canvasElement.width!==vw||canvasElement.height!==vh){
        canvasElement.width=vw; canvasElement.height=vh;
    }
    canvasCtx.clearRect(0,0,vw,vh);

    let frameGesture='neutral', frameConf=.5;
    if(results.multiHandLandmarks&&results.multiHandLandmarks.length>0){
        results.multiHandLandmarks.forEach(lm=>{
            drawConnectors(canvasCtx,lm,HAND_CONNECTIONS,{color:glowColor,lineWidth:5});
            drawLandmarks(canvasCtx,lm,{color:'#ffffff',lineWidth:1,radius:2});
        });
        const raw=results.multiHandLandmarks[0];
        smoothedLM = smoothedLM ? lerpLM(smoothedLM,raw,SMOOTH_ALPHA) : raw;
        [frameGesture,frameConf]=classifyHand(smoothedLM);
    } else {
        smoothedLM=null;
    }

    gestureHistory.push({g:frameGesture,c:frameConf});
    if(gestureHistory.length>HIST_SIZE) gestureHistory.shift();

    const votes={};
    for(const{g,c} of gestureHistory) votes[g]=(votes[g]||0)+c;
    let winner='neutral',maxV=0;
    for(const[g,v] of Object.entries(votes)) if(v>maxV){maxV=v;winner=g;}

    // FIX: proper hysteresis — reset counter when the challenger identity changes
    if(winner===lockedGesture){
        lockCounter=Math.min(lockCounter+1,99);
    } else {
        if(winner!==lastChallengerKey){ lockCounter=0; lastChallengerKey=winner; }
        lockCounter++;
        const thresh=winner==='neutral'?HOLD_RELEASE:HOLD_CONFIRM;
        if(lockCounter>=thresh){ lockedGesture=winner; lastChallengerKey=winner; lockCounter=0; }
    }

    activateTechWithGuide(lockedGesture);
}

function buildHands() {
    const h=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
    h.setOptions({maxNumHands:2,modelComplexity:MCX,minDetectionConfidence:.65,minTrackingConfidence:.55});
    h.onResults(onHandResults);
    return h;
}

function buildCamera(h) {
    return new Camera(videoElement, {
        onFrame: async () => {
            // FIX: in-flight guard prevents concurrent sends that deadlock the WASM worker
            if(isProcessing) return;
            if(!videoElement.videoWidth||!videoElement.videoHeight) return;
            isProcessing=true;
            try {
                await h.send({image:videoElement});
            } catch(e) {
                isProcessing=false;  // FIX: release guard on error so next frame retries
                console.warn('JJK: send error:',e);
            }
        },
        width:CAM_W, height:CAM_H
    });
}

async function startPipeline() {
    resetPipelineState();
    handsInst = buildHands();
    camInst   = buildCamera(handsInst);
    lastResultTs = Date.now();
    pipelineDead = false;
    await camInst.start();
}

// FIX: Full restart — rebuilds both hands AND camera (not just camera)
// Previous attempts only restarted camera, leaving the frozen WASM worker alive
async function restartPipeline() {
    if(pipelineDead) return;
    pipelineDead=true;
    camStatusEl.textContent='RESTARTING';
    console.warn('JJK: full pipeline restart');
    try { camInst.stop(); }          catch(_){}
    try { await handsInst.close(); } catch(_){}
    await new Promise(r=>setTimeout(r,1000));
    await startPipeline();
}

// FIX: Watchdog — 5s timeout triggers full restart
setInterval(()=>{
    const age=Date.now()-lastResultTs;
    if(age>5000&&!pipelineDead){ restartPipeline(); }
    else if(age>2500){ camStatusEl.textContent='RECONNECTING'; }
    else { camStatusEl.textContent='DETECTING'; }
},1500);

startPipeline();

// FIX: Tab visibility change — browser suspends camera when tab hidden
// Restart if we come back and results have been silent for 3+ seconds
document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'&&Date.now()-lastResultTs>3000) restartPipeline();
});

// ─── Animation Loop ───────────────────────────────────────────────────────────
const TARGET_FPS = tier===0?30:60;
const FRAME_MS   = 1000/TARGET_FPS;
let   lastTs     = 0;

function animate(ts){
    requestAnimationFrame(animate);
    if(ts-lastTs<FRAME_MS) return;
    lastTs=ts-((ts-lastTs)%FRAME_MS);
    if(shakeIntensity>0){
        const s=shakeIntensity*30;
        renderer.domElement.style.transform=`translate(${(R()-.5)*s}px,${(R()-.5)*s}px)`;
    } else {
        renderer.domElement.style.transform='';
    }
    for(let i=0;i<COUNT*3;i++){
        positions[i]+=(tPos[i]-positions[i])*LERP;
        colors[i]+=(tCol[i]-colors[i])*LERP;
    }
    for(let i=0;i<COUNT;i++) sizes[i]+=(tSiz[i]-sizes[i])*LERP;
    geometry.attributes.position.needsUpdate=true;
    geometry.attributes.color.needsUpdate=true;
    geometry.attributes.size.needsUpdate=true;
    if(currentTech==='shrine'){
        particles.rotation.set(0,0,0);
    } else {
        const rs=ROT_SPEED[currentTech]||ROT_SPEED.neutral;
        particles.rotation.x+=rs.x; particles.rotation.y+=rs.y; particles.rotation.z+=rs.z;
    }
    composer.render();
}

animate(0);
activateTechWithGuide('neutral');

window.addEventListener('resize',()=>{
    cam3.aspect=window.innerWidth/window.innerHeight;
    cam3.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
    composer.setSize(window.innerWidth,window.innerHeight);
});
</script>
